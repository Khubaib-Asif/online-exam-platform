name: Release

# Triggers a GitHub Release from CHANGELOG.md when a semver tag (v*.*.*) is pushed.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # required to create a GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Extracting notes for version $VERSION from CHANGELOG.md"
          # Pull the lines between this version's heading and the next "## " heading.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section found for [$VERSION]; using a fallback note." >&2
            echo "Release $GITHUB_REF_NAME. See CHANGELOG.md for details." > release-notes.md
          fi
          echo "----- release notes -----"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: false
